<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>btravstack brand card</title>
<link rel="stylesheet" href="../packages/theme/src/fonts.css">
<style>
:root { --paper:#0f1014; --ink:#f3f1f5; --muted:#b9b4c0; --rule:#323039; --accent:#e875ab; --display:'Geist',sans-serif; --mono:'JetBrains Mono',monospace; }
* { box-sizing:border-box; }
body { margin:0; width:1200px; height:630px; background:var(--paper); color:var(--ink); font-family:var(--display); }
main { position:relative; height:100%; padding:64px 68px; }
.brand { display:flex; align-items:center; gap:12px; color:var(--muted); font-size:22px; font-weight:600; }
.brand img { width:36px; height:36px; }
h1 { max-width:820px; margin:74px 0 20px; font-size:70px; font-weight:800; letter-spacing:-3px; line-height:1.07; }
p { max-width:690px; margin:0; font-size:29px; line-height:1.5; color:var(--muted); }
.mark { position:absolute; width:230px; height:230px; right:68px; top:177px; }
footer { position:absolute; bottom:48px; left:68px; right:68px; border-top:1px solid var(--rule); padding-top:22px; display:flex; justify-content:space-between; font:16px var(--mono); color:var(--muted); }
</style>
<main>
<div class="brand"><img src="../apps/website/public/logos/btravstack-dark.svg" alt="">btravstack</div>
<h1></h1><p></p><img class="mark" alt="">
<footer><span class="url"></span><span>TypeScript · Open source · MIT</span></footer>
</main>
<script>
const cards = {
  btravstack: ['Build with confidence.', 'A TypeScript backend framework.<br>Independent libraries. One coherent stack.', 'btravstack.github.io'],
  framework: ['btravstack', 'Your application, composed.<br>Your process, taken care of.', 'btravstack.github.io/btravstack'],
  unthrown: ['unthrown', 'Errors you can handle.<br>Failures you can see in the type.', 'btravstack.github.io/unthrown'],
  entity: ['entity', 'Your domain, declared once.<br>Validated at the boundary.', 'btravstack.github.io/entity'],
  'temporal-contract': ['temporal-contract', 'Durable workflows.<br>One contract, from client to worker.', 'btravstack.github.io/temporal-contract'],
  'amqp-contract': ['amqp-contract', 'Messages with a contract.<br>From publisher to consumer.', 'btravstack.github.io/amqp-contract'],
  tools: ['btravstack tools', 'Shared conventions.<br>A consistent build and release toolchain.', 'github.com/btravstack/tools'],
  theme: ['btravstack theme', 'One visual language.<br>Every project, unmistakably related.', 'btravstack.github.io'],
};
const key = new URLSearchParams(location.search).get('project') || 'btravstack';
const [name, description, url] = cards[key];
document.querySelector('h1').textContent = name;
document.querySelector('p').innerHTML = description;
document.querySelector('.url').textContent = url;
document.querySelector('.mark').src = `../apps/website/public/logos/${key}-dark.svg`;
document.querySelector('.mark').alt = `${name} logo`;
</script>
</html>
